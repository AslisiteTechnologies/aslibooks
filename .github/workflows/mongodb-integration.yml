name: MongoDB integration
on:
  pull_request:
  push:
    branches: [main, develop/phase-1-foundation]

jobs:
  mongodb-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
      MONGODB_TEST_DB_NAME: aslibooks_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name aslibooks-test-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 45); do
            if docker exec aslibooks-test-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec aslibooks-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 45); do
            if docker exec aslibooks-test-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary" >&2
          exit 1
      - run: pnpm install --no-frozen-lockfile
      - name: Run MongoDB HTTP integration tests
        run: pnpm --filter @aslibooks/api test
      - name: Stop test database
        if: always()
        run: docker rm -f aslibooks-test-mongo || true
